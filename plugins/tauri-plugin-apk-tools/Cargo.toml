[package]
name = "tauri-plugin-apk-tools"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
links = "tauri-plugin-apk-tools"

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tauri-utils = "2"
glob = "0.3"
