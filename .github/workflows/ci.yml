name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (svelte-check + tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check

  test:
    name: unit tests + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Thresholds (100%) live in each vitest config. Tests that need the user's APKs skip when absent.
      - run: bun run test:cov
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            app/coverage
            packages/core/coverage
          if-no-files-found: ignore

  e2e:
    name: playwright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
        working-directory: app
      - run: bun run test:e2e
        working-directory: app
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: app/playwright-report
          if-no-files-found: ignore

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            app/src-tauri
            plugins/tauri-plugin-apk-tools
      - run: bun install --frozen-lockfile
      - name: Install Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Build frontend (tauri-build needs frontendDist)
        run: bun run build
      - run: cargo clippy --manifest-path app/src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo clippy --manifest-path plugins/tauri-plugin-apk-tools/Cargo.toml --all-targets -- -D warnings

  kotlin:
    name: kotlin compile (Android plugin, JDK 17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install NDK + platform
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "ndk;27.2.12479018" "platforms;android-36" "platforms;android-37.0" "build-tools;35.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: bun install --frozen-lockfile
      # `tauri android build` regenerates tauri.settings.gradle (machine specific paths) and compiles
      # the app + plugin Kotlin sources; a debug single-ABI build is the cheapest full compile.
      - name: Compile Kotlin via debug build
        working-directory: app
        run: bun tauri android build --debug --apk --target aarch64
      # Robolectric + JaCoCo unit tests; the verify task enforces 100% line AND branch coverage.
      - name: Kotlin unit tests + 100% coverage gate
        working-directory: app/src-tauri/gen/android
        run: ./gradlew --no-configuration-cache :tauri-plugin-apk-tools:jacocoDebugVerify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kotlin-coverage
          path: plugins/tauri-plugin-apk-tools/android/build/reports/jacoco
          if-no-files-found: ignore

  rust-coverage:
    name: rust coverage (cargo-llvm-cov, 100% lines + functions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            app/src-tauri
            plugins/tauri-plugin-apk-tools
      - run: bun install --frozen-lockfile
      - name: Install Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Build frontend (tauri-build needs frontendDist)
        run: bun run build
      # Entry glue (main.rs, entry.rs) is excluded by name inside the script; see scripts/coverage-rust.sh.
      - run: scripts/coverage-rust.sh
