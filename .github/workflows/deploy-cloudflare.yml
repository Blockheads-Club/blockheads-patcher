name: deploy-cloudflare-pages

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Skip notice
        if: env.HAS_CLOUDFLARE != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; skipping Cloudflare Pages deploy."
      - uses: actions/checkout@v4
        if: env.HAS_CLOUDFLARE == 'true'
      - uses: oven-sh/setup-bun@v2
        if: env.HAS_CLOUDFLARE == 'true'
      - run: bun install --frozen-lockfile
        if: env.HAS_CLOUDFLARE == 'true'
      - name: Build (served from the domain root)
        if: env.HAS_CLOUDFLARE == 'true'
        run: bun run --filter @bh-patcher/app build:web
      - name: Deploy
        if: env.HAS_CLOUDFLARE == 'true'
        run: bunx wrangler@4 pages deploy app/build --project-name=blockheads-patcher --branch="${{ github.ref_name }}" --commit-dirty=true
