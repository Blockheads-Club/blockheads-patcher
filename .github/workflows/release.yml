name: release

# Push a tag `vX.Y.Z` (or `vX.Y.Z-pre.N`) to build every bundle and attach it to a DRAFT GitHub release for that tag.
# Publish the draft by hand once CI is green. Manual runs (workflow_dispatch) take the tag as input; with an empty tag
# they build the dispatched commit as a dry run (artifacts + SHA256SUMS.txt only, no release is touched).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach (e.g. v0.1.0); empty = dry run of the dispatched commit'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # Dry runs of a branch supersede each other; tag runs never cancel a half-uploaded release.
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' && inputs.tag == '' }}

jobs:
  version:
    name: version from tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      ref: ${{ steps.v.outputs.ref }}
      version: ${{ steps.v.outputs.version }}
      bundle_version: ${{ steps.v.outputs.bundle_version }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_dispatch' && inputs.tag == ''
      - id: v
        env:
          INPUT_TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.tag == '' }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            # Dry run: no tag, version from tauri.conf.json, build the dispatched commit.
            tag=""
            ref="$GITHUB_SHA"
            version=$(jq -r .version app/src-tauri/tauri.conf.json)
          else
            tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
            case "$tag" in v[0-9]*) ;; *) echo "::error::not a version tag: $tag"; exit 1 ;; esac
            ref="$tag"
            version="${tag#v}"
          fi
          # MSI only accepts numeric prerelease identifiers: 1.0.0-dev.3 -> 1.0.0-3 for bundle metadata.
          bundle=$(echo "$version" | sed -E 's/-[A-Za-z]+\./-/')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "bundle_version=$bundle" >> "$GITHUB_OUTPUT"

  web:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.ref }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run --filter @bh-patcher/app build:web
      - name: Zip
        run: |
          mkdir -p dist-release
          (cd app/build && zip -r -q "$GITHUB_WORKSPACE/dist-release/blockheads-patcher-web-${{ needs.version.outputs.version }}.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: rel-web
          path: dist-release/*
          if-no-files-found: error

  desktop:
    name: desktop (${{ matrix.name }})
    needs: version
    if: needs.version.outputs.version != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            args: --bundles nsis,msi
          - name: windows-arm64
            os: windows-11-arm
            args: --bundles nsis,msi
          # 22.04 (glibc 2.35) on both arches so the bundles run on older distros too.
          - name: linux-x64
            os: ubuntu-22.04
            args: --bundles appimage,deb,rpm
          - name: linux-arm64
            os: ubuntu-22.04-arm
            args: --bundles appimage,deb,rpm
          - name: macos-universal
            os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles dmg
          - name: macos-arm64
            os: macos-latest
            targets: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles dmg
          - name: macos-x64
            os: macos-latest
            targets: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.ref }}
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          key: ${{ matrix.name }}
      - name: Linux system libraries
        if: startsWith(matrix.name, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils file libfuse2
      - run: bun install --frozen-lockfile
      - name: Build bundles
        working-directory: app
        shell: bash
        run: bun tauri build ${{ matrix.args }} --config '{"version":"${{ needs.version.outputs.bundle_version }}"}'
      - name: Collect
        shell: bash
        run: |
          mkdir -p dist-release
          find app/src-tauri/target -path '*/release/bundle/*' -type f \
            \( -name '*.exe' -o -name '*.msi' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.dmg' \) \
            -exec cp {} dist-release/ \;
          ls -la dist-release
      - uses: actions/upload-artifact@v4
        with:
          name: rel-${{ matrix.name }}
          path: dist-release/*
          if-no-files-found: error

  android:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.ref }}
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install NDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "ndk;27.2.12479018" "platforms;android-36" "platforms;android-37.0" "build-tools;35.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: bun install --frozen-lockfile
      - name: Build APKs (debug, no signing secrets)
        if: env.HAS_SIGNING != 'true'
        working-directory: app
        run: bun tauri android build --debug --apk --split-per-abi --target aarch64 --target armv7 --target x86_64 --config '{"version":"${{ needs.version.outputs.bundle_version }}"}'
      - name: Build APKs (release, signed)
        if: env.HAS_SIGNING == 'true'
        working-directory: app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > src-tauri/gen/android/keystore.properties <<PROPS
          password=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          storeFile=$RUNNER_TEMP/release.jks
          PROPS
          bun tauri android build --apk --split-per-abi --target aarch64 --target armv7 --target x86_64 --config '{"version":"${{ needs.version.outputs.bundle_version }}"}'
      - name: Collect
        run: |
          mkdir -p dist-release
          find app/src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | while read -r f; do
            abi=$(echo "$f" | sed -E 's#.*/apk/([^/]+)/.*#\1#')
            cp "$f" "dist-release/blockheads-patcher-${{ needs.version.outputs.version }}-android-${abi}.apk"
          done
          ls -la dist-release
      - uses: actions/upload-artifact@v4
        with:
          name: rel-android
          path: dist-release/*
          if-no-files-found: error

  publish:
    name: draft GitHub release
    needs: [version, web, desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rel-*
          path: dist-release
          merge-multiple: true
      - name: Normalise asset names and write SHA256SUMS.txt
        working-directory: dist-release
        run: |
          # GitHub turns spaces in asset names into dots; rename first so the sums match the stored names.
          for f in *' '*; do [ -e "$f" ] && mv -v -- "$f" "${f// /.}"; done
          rm -f SHA256SUMS.txt
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-all
          path: dist-release/*
          if-no-files-found: error
      - name: Create or update the draft release (prerelease only for -pre tags such as v0.2.0-rc.1)
        if: needs.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-release/* --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist-release/* --draft $pre --verify-tag --title "$TAG" --generate-notes -R "$GITHUB_REPOSITORY"
          fi
