name: release

# Push a tag `vX.Y.Z` (or `vX.Y.Z-pre.N`) to build every bundle and attach it to a DRAFT GitHub release for that tag.
# Publish the draft by hand once CI is green. Manual runs (workflow_dispatch) take the tag as input.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach (e.g. v0.1.0)'
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: version from tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      bundle_version: ${{ steps.v.outputs.bundle_version }}
    steps:
      - id: v
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-$GITHUB_REF_NAME}"
          case "$tag" in v[0-9]*) ;; *) echo "::error::not a version tag: $tag"; exit 1 ;; esac
          version="${tag#v}"
          # MSI only accepts numeric prerelease identifiers: 1.0.0-dev.3 -> 1.0.0-3 for bundle metadata.
          bundle=$(echo "$version" | sed -E 's/-[A-Za-z]+\./-/')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "bundle_version=$bundle" >> "$GITHUB_OUTPUT"

  web:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run --filter @bh-patcher/app build:web
      - name: Zip
        run: |
          mkdir -p dist-release
          (cd app/build && zip -r -q "$GITHUB_WORKSPACE/dist-release/blockheads-patcher-web-${{ needs.version.outputs.version }}.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: rel-web
          path: dist-release/*
          if-no-files-found: error

  desktop:
    needs: version
    if: needs.version.outputs.version != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            args: --bundles nsis,msi
          - name: linux
            os: ubuntu-22.04
            args: --bundles appimage,deb
          - name: macos
            os: macos-latest
            args: --target universal-apple-darwin --bundles dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Linux system libraries
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils
      - run: bun install --frozen-lockfile
      - name: Build bundles
        working-directory: app
        shell: bash
        run: bun tauri build ${{ matrix.args }} --config '{"version":"${{ needs.version.outputs.bundle_version }}"}'
      - name: Collect
        shell: bash
        run: |
          mkdir -p dist-release
          find app/src-tauri/target -path '*/release/bundle/*' -type f \
            \( -name '*.exe' -o -name '*.msi' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.dmg' \) \
            -exec cp {} dist-release/ \;
          ls -la dist-release
      - uses: actions/upload-artifact@v4
        with:
          name: rel-${{ matrix.name }}
          path: dist-release/*
          if-no-files-found: error

  android:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install NDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "ndk;27.2.12479018" "platforms;android-36" "platforms;android-37.0" "build-tools;35.0.0"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: bun install --frozen-lockfile
      - name: Build APKs (debug, no signing secrets)
        if: env.HAS_SIGNING != 'true'
        working-directory: app
        run: bun tauri android build --debug --apk --split-per-abi --target aarch64 --target armv7 --target x86_64 --config '{"version":"${{ needs.version.outputs.bundle_version }}"}'
      - name: Build APKs (release, signed)
        if: env.HAS_SIGNING == 'true'
        working-directory: app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > src-tauri/gen/android/keystore.properties <<PROPS
          password=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          storeFile=$RUNNER_TEMP/release.jks
          PROPS
          bun tauri android build --apk --split-per-abi --target aarch64 --target armv7 --target x86_64 --config '{"version":"${{ needs.version.outputs.bundle_version }}"}'
      - name: Collect
        run: |
          mkdir -p dist-release
          find app/src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | while read -r f; do
            abi=$(echo "$f" | sed -E 's#.*/apk/([^/]+)/.*#\1#')
            cp "$f" "dist-release/blockheads-patcher-${{ needs.version.outputs.version }}-android-${abi}.apk"
          done
          ls -la dist-release
      - uses: actions/upload-artifact@v4
        with:
          name: rel-android
          path: dist-release/*
          if-no-files-found: error

  publish:
    name: draft GitHub release
    needs: [version, web, desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rel-*
          path: dist-release
          merge-multiple: true
      - run: ls -la dist-release
      - name: Create or update the draft release (prerelease for 0.x and -pre tags)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          pre=""
          case "$TAG" in v0.*|*-*) pre="--prerelease" ;; esac
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist-release/* --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist-release/* --draft $pre --verify-tag --title "$TAG" --generate-notes -R "$GITHUB_REPOSITORY"
          fi
